[project]
name = "scholar-dossier-agent"
version = "0.1.0"
description = "A human-in-the-loop AI agent that builds scholar impact dossiers and drafts one-sentence impact summaries."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "dotenv>=0.9.9",
    "en-core-web-sm",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "openai>=2.6.1",
    "pandas>=2.2.3",
    "pydantic>=2.11.3",
    "pytest>=8.4.2",
    "spacy>=3.7,<4",
    "tavily>=1.1.0",
    "tenacity>=9.1.2",
    "tiktoken>=0.13.0",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
